trigger:
- development

pool: LinuxPool

variables:
  imageName: devfront
  nexusHost: package.arianerp.ir
  nexusDocker: 216.65.200.107:5000
  nexusRepo: docker-hosted
  NODE_OPTIONS: --max-old-space-size=4096

steps:

# =========================
# 1. Checkout
# =========================
- checkout: self
  clean: true
  fetchDepth: 1

# =========================
# 2. Node setup
# =========================
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: Install Node.js

# =========================
# 3. Install dependencies
# =========================
- script: |
    npm install --registry="https://$(nexusHost)/repository/npm-proxy/"
  displayName: npm install

# =========================
# 4. Build (ONLY ON CI)
# =========================
- script: |
    npm run testing-build
  displayName: Build Frontend

# =========================
# 5. Login Nexus
# =========================
- script: |
    set -e
    echo "$(NEXUS_PASS)" | docker login $(nexusDocker) -u "$(NEXUS_USER)" --password-stdin
  displayName: Login Nexus

# =========================
# 6. Build Docker Image
# =========================
- script: |
    IMAGE="$(nexusDocker)/$(imageName):$(Build.BuildId)"

    docker build -t $IMAGE .

    docker tag $IMAGE $(nexusDocker)/$(imageName):latest
  displayName: Build Docker Image

# =========================
# 7. Push Image
# =========================
- script: |
    set -e

    IMAGE="$(nexusDocker)/$(imageName):$(Build.BuildId)"

    docker push $IMAGE
    docker push $(nexusDocker)/$(imageName):latest
  displayName: Push Image
 
# =========================
# 8. Docker Compose down
# =========================
- task: SSH@0
  displayName: 'Docker Compose down'
  inputs:
    sshEndpoint: 'Linux 241'
    commands: 'docker compose -f  /home/sobhan/AzureDevOps-Build-Front/DockerCompose/compose.yaml down'
    failOnStdErr: false
  continueOnError: true

# =========================
# 9. Docker Compose pull
# =========================
- task: SSH@0
  displayName: 'Docker Compose pull'
  inputs:
    sshEndpoint: 'Linux 241'
    commands: 'docker compose -f  /home/sobhan/AzureDevOps-Build-Front/DockerCompose/compose.yaml pull'
    failOnStdErr: false
  continueOnError: true

# =========================
# 9. Docker Compose up
# =========================
- task: SSH@0
  displayName: 'Docker Compose up'
  inputs:
    sshEndpoint: 'Linux 241'
    commands: 'docker compose -f  /home/sobhan/AzureDevOps-Build-Front/DockerCompose/compose.yaml up -d'
    failOnStdErr: false
  continueOnError: true