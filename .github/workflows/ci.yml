name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        # Repo lockfile is yarn.lock (no package-lock.json).
        # yarn --frozen-lockfile is the reproducible equivalent of npm ci.
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Typecheck publish graph
        run: yarn typecheck:publish

      - name: Typecheck host UI
        run: yarn typecheck:host-ui

      - name: Build
        run: yarn build

      - name: Verify dist
        run: yarn verify:dist

      - name: Size budget
        run: yarn size
